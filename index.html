<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Patrol</title>
    
    <!-- โหลดไลบรารีที่จำเป็นผ่าน CDN อย่างเสถียร -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 pb-10">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEWWFteQSwJUK6P3Hmr_iKFY5eKXEQ5fBtZkgaPjCVrJeK6mOSu-1O-dffemGw9H_u/exec';

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState([]);
            const [branches, setBranches] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadingText, setLoadingText] = useState('กำลังโหลดข้อมูล...');
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            
            const [filterYear, setFilterYear] = useState('all');
            const [filterMonth, setFilterMonth] = useState('all');
            const [filterBranch, setFilterBranch] = useState('all');
            const [statusFilter, setStatusFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');

            const [currentPageStatus, setCurrentPageStatus] = useState(1);
            const [currentPageDash, setCurrentPageDash] = useState(1);
            const itemsPerPage = 10;

            const [selectedItem, setSelectedItem] = useState(null);
            const [showDetailModal, setShowDetailModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [selectedForPrint, setSelectedForPrint] = useState([]);
            const [showPrintPreview, setShowPrintPreview] = useState(false);
            
            const [editData, setEditData] = useState(null);
            const [editAfterImage, setEditAfterImage] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState({ show: false, message: '', onConfirm: null });
            const [enlargedImage, setEnlargedImage] = useState(null);

            const [formData, setFormData] = useState({
                reporterName: '',
                dateFound: new Date().toISOString().split('T')[0],
                branch: '',
                items: [{
                    id: Date.now(), location: '', detail: '', responsible: '', status: 'ยังไม่ดำเนินการ', beforeImage: null, afterImage: null
                }]
            });

            const months = [
                { val: '01', label: 'มกราคม' }, { val: '02', label: 'กุมภาพันธ์' }, { val: '03', label: 'มีนาคม' },
                { val: '04', label: 'เมษายน' }, { val: '05', label: 'พฤษภาคม' }, { val: '06', label: 'มิถุนายน' },
                { val: '07', label: 'กรกฎาคม' }, { val: '08', label: 'สิงหาคม' }, { val: '09', label: 'กันยายน' },
                { val: '10', label: 'ตุลาคม' }, { val: '11', label: 'พฤศจิกายน' }, { val: '12', label: 'ธันวาคม' }
            ];

            const years = Array.from({ length: 15 }, (_, i) => 2025 + i);

            useEffect(() => {
                fetchData();
                fetchBranches();
            }, []);

            const fetchData = async () => {
                setIsLoading(true);
                setLoadingText('กำลังโหลดข้อมูล...');
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=get`);
                    if (!response.ok) throw new Error('Network error');
                    const result = await response.json();
                    if (result.status === 'error') throw new Error(result.message);
                    setData(Array.isArray(result) && result.length > 0 ? result : []);
                } catch (error) {
                    console.warn("Fetch Error:", error);
                    showToast('แสดงข้อมูลจำลอง เนื่องจากไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'warning');
                } finally {
                    setIsLoading(false);
                }
            };

            const fetchBranches = async () => {
                try {
                    const response = await fetch(`${SCRIPT_URL}?action=getBranches`);
                    if (response.ok) {
                        const result = await response.json();
                        if (Array.isArray(result)) setBranches(result);
                    }
                } catch (error) {
                    console.warn("Failed to fetch branches");
                }
            };

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            const extractFileId = (url) => {
                if (!url) return null;
                const match = url.match(/[-\w]{25,}/);
                return match ? match[0] : null;
            };

            const getDirectImageUrl = (driveUrl) => {
                const id = extractFileId(driveUrl);
                return id ? `https://lh3.googleusercontent.com/d/${id}` : driveUrl;
            };

            const getPdfImageUrl = (driveUrl) => {
                const id = extractFileId(driveUrl);
                return id ? `https://lh3.googleusercontent.com/d/${id}?t=${new Date().getTime()}` : driveUrl;
            };

            const handleImageError = (e, originalUrl) => {
                const id = extractFileId(originalUrl);
                if (!id) { e.target.style.display = 'none'; return; }
                if (!e.target.dataset.fallback) {
                    e.target.dataset.fallback = '1';
                    e.target.src = `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
                } else if (e.target.dataset.fallback === '1') {
                    e.target.dataset.fallback = '2';
                    e.target.src = `https://drive.google.com/uc?export=view&id=${id}`;
                } else { e.target.style.display = 'none'; }
            };

            const handlePdfImageError = (e, originalUrl) => {
                const id = extractFileId(originalUrl);
                if (!id) { e.target.style.display = 'none'; return; }
                if (!e.target.dataset.fallback) {
                    e.target.dataset.fallback = '1';
                    e.target.src = `https://drive.google.com/thumbnail?id=${id}&sz=w800&t=${new Date().getTime()}`;
                } else { e.target.style.display = 'none'; }
            };

            const safeDate = (dateStr) => {
                const d = new Date(dateStr);
                return isNaN(d.getTime()) ? new Date() : d;
            };

            const cleanString = (str) => {
                const s = (str || '').toString().trim();
                return s === 'กำลังดำเนินการ' ? 'อยู่ระหว่างดำเนินการ' : s;
            };

            const getStatusBadgeWithIcon = (status) => {
                const clean = cleanString(status);
                if (clean === 'ดำเนินการแล้วเสร็จ') return <span className="inline-flex items-center gap-1.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-600"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ดำเนินการแล้วเสร็จ</span>;
                if (clean === 'รออะไหล่/รอช่างนอกเข้าซ่อม') return <span className="inline-flex items-center gap-1.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-purple-600"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> รอช่าง/อะไหล่</span>;
                if (clean === 'อยู่ระหว่างดำเนินการ') return <span className="inline-flex items-center gap-1.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-amber-600"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> อยู่ระหว่างดำเนินการ</span>;
                return <span className="inline-flex items-center gap-1.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-rose-600"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ยังไม่ดำเนินการ</span>;
            };

            const handleFileChange = (index, type, e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { showToast('ขนาดไฟล์ต้องไม่เกิน 2MB', 'error'); return; }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    const newItems = [...formData.items];
                    newItems[index][type] = { name: file.name, mimeType: file.type, data: base64Data, previewUrl: event.target.result };
                    setFormData({ ...formData, items: newItems });
                };
                reader.readAsDataURL(file);
            };

            const handleEditFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) { showToast('ขนาดไฟล์ต้องไม่เกิน 2MB', 'error'); return; }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    setEditAfterImage({ name: file.name, mimeType: file.type, data: base64Data, previewUrl: event.target.result });
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.branch) { showToast('กรุณาเลือกสาขา', 'error'); return; }
                
                setIsLoading(true);
                setLoadingText('กำลังบันทึกข้อมูลและอัปโหลดรูปภาพ...');
                try {
                    const payload = { action: 'submit', data: JSON.stringify(formData) };
                    const params = new URLSearchParams(payload);
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: params, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        showToast('บันทึกข้อมูลเรียบร้อยแล้ว');
                        setFormData({ ...formData, items: [{ id: Date.now(), location: '', detail: '', responsible: '', status: 'ยังไม่ดำเนินการ', beforeImage: null, afterImage: null }] });
                        fetchData();
                        setActiveTab('status');
                    } else throw new Error(result.message);
                } catch (error) {
                    showToast(error.toString(), 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const submitEdit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setLoadingText('กำลังอัปเดตข้อมูล...');
                try {
                    const updatePayload = {
                        ID: editData.ID.toString(),
                        Branch: editData.Branch,
                        Location: editData.Location,
                        Detail: editData.Detail,
                        Responsible: editData.Responsible,
                        Status: editData.Status,
                        afterImage: editAfterImage ? {
                            name: editAfterImage.name,
                            mimeType: editAfterImage.mimeType,
                            data: editAfterImage.data
                        } : null
                    };
                    const payload = { action: 'edit', data: JSON.stringify(updatePayload) };
                    const params = new URLSearchParams(payload);
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: params, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        showToast('แก้ไขข้อมูลสำเร็จ');
                        setShowEditModal(false);
                        fetchData();
                        
                        if (showDetailModal) {
                            setSelectedItem({...editData, AfterImageURL: editAfterImage ? 'updating...' : editData.AfterImageURL});
                        }
                    } else throw new Error(result.message);
                } catch (error) {
                    showToast(error.toString(), 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const confirmDelete = (id) => {
                setConfirmDialog({
                    show: true,
                    message: 'คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้? (ไม่สามารถกู้คืนได้)',
                    onConfirm: () => executeDelete(id)
                });
            };

            const executeDelete = async (id) => {
                setIsLoading(true);
                setLoadingText('กำลังลบข้อมูล...');
                try {
                    const payload = { action: 'delete', data: JSON.stringify({ id: id.toString() }) };
                    const params = new URLSearchParams(payload);
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: params, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    const result = await response.json();
                    if (result.status === 'success') {
                        showToast('ลบข้อมูลสำเร็จ');
                        fetchData();
                        setShowDetailModal(false);
                        setSelectedForPrint(selectedForPrint.filter(i => i.ID !== id));
                    } else throw new Error(result.message);
                } catch (error) {
                    showToast(error.toString(), 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const togglePrintSelection = (item) => {
                if (selectedForPrint.find(i => i.ID === item.ID)) {
                    setSelectedForPrint(selectedForPrint.filter(i => i.ID !== item.ID));
                } else {
                    setSelectedForPrint([...selectedForPrint, item]);
                }
            };

            const handleGeneratePDF = async () => {
                setIsLoading(true);
                setLoadingText('กำลังสร้างไฟล์ PDF...');
                
                const printContainer = document.getElementById('print-modal-container');
                if (printContainer) {
                    printContainer.style.overflow = 'visible';
                    printContainer.style.height = 'auto';
                    printContainer.style.maxHeight = 'none';
                }

                try {
                    if (typeof window.html2pdf === 'undefined') {
                        await new Promise((resolve, reject) => {
                            const script = document.createElement('script');
                            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                            script.onload = resolve;
                            script.onerror = reject;
                            document.head.appendChild(script);
                        });
                    }
                    
                    const element = document.getElementById('print-area');
                    const opt = {
                        margin:       10, 
                        filename:     `Safety_Patrol_Report_${new Date().getTime()}.pdf`,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { 
                            scale: 2, 
                            useCORS: true, 
                            logging: false,
                            scrollY: 0,
                            windowWidth: document.documentElement.offsetWidth 
                        }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: ['css', 'avoid-all'] } 
                    };
                    
                    await window.html2pdf().set(opt).from(element).save();
                    showToast('ดาวน์โหลดไฟล์ PDF สำเร็จ', 'success');
                    setShowPrintPreview(false);
                } catch (error) {
                    console.error("Print error:", error);
                    showToast('เกิดข้อผิดพลาดในการสร้าง PDF', 'error');
                } finally {
                    if (printContainer) {
                        printContainer.style.overflow = 'auto';
                        printContainer.style.height = '100%';
                        printContainer.style.maxHeight = '100vh';
                    }
                    setIsLoading(false);
                }
            };

            const PrintPreviewModal = () => {
                if (!showPrintPreview) return null;

                return (
                    <div id="print-modal-container" className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[300] overflow-y-auto animate-fade-in flex flex-col items-center">
                        <div className="sticky top-0 bg-slate-900 text-white p-4 flex justify-between items-center z-50 shadow-2xl border-b border-slate-800 w-full min-w-max">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-inner">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-white"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                                </div>
                                <div>
                                    <h3 className="text-xl font-bold">ตัวอย่างก่อนพิมพ์ (Print Preview)</h3>
                                    <p className="text-sm text-slate-400">จัดหน้าแบบ 2 รายการต่อ 1 หน้า A4 ให้อัตโนมัติ</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowPrintPreview(false)} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-colors border border-slate-700 flex items-center gap-2">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ปิดหน้าต่าง
                                </button>
                                <button onClick={handleGeneratePDF} disabled={isLoading} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 rounded-xl font-bold transition-colors flex items-center gap-2 shadow-[0_0_20px_rgba(79,70,229,0.5)] border border-indigo-500">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> บันทึก PDF
                                </button>
                            </div>
                        </div>

                        <div className="p-8 pb-24 w-full flex-1 flex justify-center bg-slate-800">
                            <div className="bg-white shadow-2xl relative h-max" style={{ width: '210mm', minHeight: '297mm', padding: '10mm', boxSizing: 'border-box', margin: '0 auto', flexShrink: 0 }}>
                                <div id="print-area" style={{ width: '190mm', margin: '0 auto', backgroundColor: '#fff', fontSize: '13px', fontFamily: '"Tahoma", "Sarabun", sans-serif', color: '#0f172a' }}>
                                    <div style={{ textAlign: 'center', paddingBottom: '10px', marginBottom: '15px' }}>
                                        <h1 style={{ fontSize: '22px', fontWeight: 'bold', margin: '0 0 5px 0', textTransform: 'uppercase' }}>SAFETY PATROL REPORT</h1>
                                        <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 5px 0' }}>เอกสารรายงานผลการตรวจความปลอดภัย</h2>
                                        <h3 style={{ fontSize: '14px', fontWeight: 'normal', margin: '0', color: '#475569' }}>บริษัท สยามโกลบอลเฮ้าส์ จำกัด (มหาชน)</h3>
                                    </div>
                                    <div>
                                        {selectedForPrint.map((item, index) => {
                                            const actualStatus = cleanString(item.Status);
                                            return (
                                                <div key={item.ID || index} style={{ marginBottom: '25px', paddingBottom: '10px', pageBreakInside: 'avoid' }}>
                                                    <div style={{ fontWeight: 'bold', fontSize: '15px', marginBottom: '8px', color: '#0f172a' }}>
                                                        รายการที่ {index + 1}
                                                    </div>
                                                    <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '15px', tableLayout: 'fixed', fontSize: '13px' }}>
                                                        <tbody>
                                                            <tr>
                                                                <td style={{ width: '15%', padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>วันที่ตรวจพบ:</td>
                                                                <td style={{ width: '35%', padding: '4px 0', verticalAlign: 'top', wordBreak: 'break-word' }}>{safeDate(item.DateFound).toLocaleDateString('th-TH')}</td>
                                                                <td style={{ width: '10%', padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>สาขา:</td>
                                                                <td style={{ width: '40%', padding: '4px 0', verticalAlign: 'top', fontWeight: 'bold', wordBreak: 'break-word' }}>{item.Branch}</td>
                                                            </tr>
                                                            <tr>
                                                                <td style={{ padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>สถานที่:</td>
                                                                <td colSpan="3" style={{ padding: '4px 0', verticalAlign: 'top', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{item.Location}</td>
                                                            </tr>
                                                            <tr>
                                                                <td style={{ padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>รายละเอียด:</td>
                                                                <td colSpan="3" style={{ padding: '4px 0', verticalAlign: 'top', whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{item.Detail}</td>
                                                            </tr>
                                                            <tr>
                                                                <td style={{ padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>ผู้แจ้ง:</td>
                                                                <td style={{ padding: '4px 0', verticalAlign: 'top', wordBreak: 'break-word' }}>{item.ReporterName || '-'}</td>
                                                                <td style={{ padding: '4px 0', fontWeight: 'bold', verticalAlign: 'top' }}>ผู้รับผิดชอบ:</td>
                                                                <td style={{ padding: '4px 0', verticalAlign: 'top', wordBreak: 'break-word' }}>{item.Responsible}</td>
                                                            </tr>
                                                        </tbody>
                                                    </table>

                                                    <div style={{ marginBottom: '12px' }}>
                                                        <span style={{ fontSize: '13px', fontWeight: 'bold', display: 'inline-block' }}>
                                                            สถานะ: {actualStatus}
                                                        </span>
                                                    </div>

                                                    {(item.BeforeImageURL || item.AfterImageURL) && (
                                                        <table style={{ width: '100%', tableLayout: 'fixed', borderCollapse: 'separate', borderSpacing: '10px 0' }}>
                                                            <tbody>
                                                                <tr>
                                                                    {item.BeforeImageURL ? (
                                                                        <td style={{ width: item.AfterImageURL ? '50%' : '100%', padding: '0', textAlign: 'center', verticalAlign: 'top' }}>
                                                                            <div style={{ fontSize: '13px', fontWeight: 'bold', marginBottom: '6px' }}>รูปก่อนแก้ไข</div>
                                                                            <div style={{ height: '160px', display: 'flex', justifyContent: 'center', alignItems: 'center', overflow: 'hidden' }}>
                                                                                <img src={getPdfImageUrl(item.BeforeImageURL)} crossOrigin="anonymous" alt="ก่อน" style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} onError={(e) => handlePdfImageError(e, item.BeforeImageURL)} />
                                                                            </div>
                                                                        </td>

                                    </div>

                                    <button type="submit" disabled={isLoading} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-5 rounded-[1.5rem] shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all flex justify-center items-center gap-3 text-lg disabled:opacity-50 disabled:hover:translate-y-0 mt-8 border border-slate-700">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> บันทึกข้อมูลเข้าระบบ
                                    </button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'status' && renderStatus()}
                    </main>

                    {}
                    {isLoading && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] flex flex-col items-center justify-center">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center animate-fade-in-up min-w-[280px] border border-slate-200">
                                <div className="w-16 h-16 border-4 border-slate-100 border-t-indigo-600 rounded-full animate-spin mb-5"></div>
                                <p className="text-slate-800 font-black text-lg">{loadingText}</p>
                            </div>
                        </div>
                    )}

                    <DetailModal />
                    <EditModal />
                    <PrintPreviewModal />
                    <ConfirmModal />
                    <ImageViewerModal />

                    <div className={`fixed bottom-6 right-6 z-[1000] transition-all duration-300 ${toast.show ? 'translate-y-0 opacity-100 scale-100' : 'translate-y-10 opacity-0 scale-95 pointer-events-none'}`}>
                        <div className={`px-6 py-4 rounded-2xl shadow-2xl font-bold flex items-center gap-3 border ${
                            toast.type === 'error' ? 'bg-white border-rose-200 text-rose-600' : 
                            toast.type === 'warning' ? 'bg-white border-amber-200 text-amber-600' : 'bg-slate-800 border-slate-700 text-white'
                        }`}>
                            {toast.type === 'error' ? (
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            ) : (
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            )}
                            {toast.message}
                        </div>
                    </div>

                    <style dangerouslySetInnerHTML={{__html: `
                        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
                        @keyframes fade-in-up { from { opacity: 0; transform: translateY(15px); scale: 0.95; } to { opacity: 1; transform: translateY(0); scale: 1; } }
                        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
                        .animate-fade-in-up { animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
                        .hide-scrollbar::-webkit-scrollbar { display: none; }
                        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
                    `}} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
